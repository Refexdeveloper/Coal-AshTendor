# Auto-deploy Coal & Ash to Cloud Run on GitHub push.
# Flow: npm client build (inside Docker) → push image → deploy Cloud Run
# (same single-service pattern as kavis-npi-portal)

substitutions:
  _REGION: asia-south1
  _SERVICE: coal-ash-tender-api
  _AR_REPO: coal-ash-repo
  _SQL_INSTANCE: master-diorama-489103-u2:asia-south1:coal-ash-mysql
  _DOCS_BUCKET: coal-ash-docs-master-diorama-489103-u2
  _RUNTIME_SA: coal-ash-run@master-diorama-489103-u2.iam.gserviceaccount.com
  _DB_NAME: coal_ash_tender
  _DB_USER: coal_ash_app

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build image (Dockerfile runs npm ci + client build → server/public)
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender:latest
      - .

  # 2) Push image tags
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender

  # 3) Deploy Cloud Run (client already baked into image; server starts on PORT)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=900
      - --set-secrets=DB_PASSWORD=coal-ash-db-password:latest,SESSION_SECRET=coal-ash-session-secret:latest
      - --set-env-vars=NODE_ENV=production,HOST=0.0.0.0,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},INSTANCE_CONNECTION_NAME=${_SQL_INSTANCE},STORAGE_BACKEND=gcs,GCS_BUCKET=${_DOCS_BUCKET},GCS_PREFIX=coal-ash-docs/,AUTO_DB_SETUP=true,AUTO_DB_SEED=true,DEMO_LOGIN_HINT=true

  # 4) Point public URLs at the live service (OCR + email links)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: set-public-urls
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')"
        gcloud run services update ${_SERVICE} \
          --region=${_REGION} \
          --update-env-vars="APP_URL=$${URL},PUBLIC_APP_URL=$${URL},FRONTEND_URL=$${URL},OCR_PUBLIC_BASE_URL=$${URL}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/coal-ash-tender:latest

timeout: 1200s
